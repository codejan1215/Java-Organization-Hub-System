<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google.com</title>
    </head>

    <body>

        <style>
            .title {
                font-family: Arial, sans-serif;
                font-size: 80px;
                text-align: center;
                margin-top: 200px;
                margin-bottom: 0px;
                font-weight: 550;
            }
            .G {
                color: #4285F4;
            }
            .o {
                color: #EA4335;
            }
            .o2 {
                color: #FBBC05;
            }
            .g {
                color: #4285F4;
            }
            .l {
                color: #34A853;
            }
            .e {
                color: #EA4335;
            }

            .search-bar {
                display: block;
                border-width: 0px;
                border-style: solid;
                border-radius: 50px;
                margin: 0 auto;
                margin-top: 15px;
                padding-top: 10px;
                padding-left: 20px;
                padding-bottom: 10px;
                width: 500px; 
                font-size: 17px;
                box-shadow: 0px 0px 10px 5px rgba(0, 0, 0, 0.10);
                transition: box-shadow 0.3s ease;
            }

            .search-bar:hover {
                box-shadow: 0px 0px 15px 7px rgba(0, 90, 117, 0.15);
            }
        </style>

        <h1 class="title"> <span class="G">G</span><span class="o">o</span><span class="o2">o</span><span class="g">g</span><span class="l">l</span><span class="e">e</span> </h1>

        <input class="search-bar" type="text" placeholder="Search Google or type a URL">

    </body>

</html>

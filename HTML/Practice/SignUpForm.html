<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
    </head>

    <body>

        <style>
            .first-name, .last-name {
                margin-bottom: 10px;
                font-size: 13px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 10px;
                width: 100px;
                border: 1px solid #ccc;
                border-radius: 8px;
            }

            .email {
                display: block;
                margin-bottom: 10px;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 13px;
                width: 210px;
            }   

            .sign-up-button {
                background-color: #4285F4;
                font-size: 15px;
                font-weight: bold;
                color: white;
                border: none;
                border-radius: 8px;
                padding: 10px 90px;
                cursor: pointer;
            }

            .sign-up-button:hover {
                background-color: #3367D6;
            }

            p {
                font-family: Arial;
            }

            .title {
                font-size: 40px;
                margin-bottom: 25px;
            }

            input {
                display: block;
                background-color: rgb(240, 240, 240);
                border: none;
                margin-bottom: 10px;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 20px;
                padding-right: 20px;
                font-size: 16px;
                width: 400px;
            }

            .destination-textbox {
                margin-bottom: 35px;
            }

            .request-button {
                background-color: black;
                color: white;
                border: none;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 25px;
                padding-right: 25px;
                font-size: 16px;
                margin-right: 20px;
            }

            .schedule-button {
                background-color: rgb(240, 240, 240);
                border: none;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 25px;
                padding-right: 25px;
                font-size: 16px;
            }
        </style>

        <!-- Sign up form -->
        <input class="first-name" type="text" placeholder="First Name">
        <input class="last-name" type="text" placeholder="Last Name">
        <input class="email" type="email" placeholder="Email">
        <button class="sign-up-button">Sign Up</button>

        <!-- Request a ride form -->
        <p class="title"> Request a ride now </p>
        <input class="pickup-textbox" type="text" placeholder="Enter pickup location">
        <input class="destination-textbox" type="text" placeholder="Enter destination">
        <button class="request-button">Request now</button>
        <button class="schedule-button">Schedule for later</button>

    </body>
</html>
